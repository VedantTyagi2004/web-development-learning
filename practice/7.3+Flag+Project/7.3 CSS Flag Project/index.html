<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Project Flag</title>
    <style>
      .flag {
        background-color: rgb(206, 27, 38);
        height: 400px;
        width: 600px;
        position: relative;
      }

      .flag > div {
        position: absolute;
        background-color: rgb(0, 40, 104);
        left: 50;
        top: 25%;
        width: 600px;
        height: 50%;
      }
      .flag > div > div {
        height: 200px;
        width: 200px;
        background-color: rgb(255, 255, 255);
        border-radius: 50%;
        position: absolute;
        left: 180px;
        top: 0px;
      }
      .flag > p {
        color: white;
        font-size: 50px;
        text-align: center;
        position: absolute;
        left: 180px;
        top: -50px;
      }
      p {
        font-family: "Courier New", Courier, monospace;
        font-size: 50px;
        text-align: center;
        position: relative;
        top: -40px;
      }
    </style>
  </head>

  <body>
    <div class="flag">
      <p>The Flag</p>
      <div>
        <div>
          <p>of<br />Laos</p>
        </div>
      </div>
    </div>
  </body>
</html>
